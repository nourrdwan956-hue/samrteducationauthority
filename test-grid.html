<!DOCTYPE html>
<html>
<head>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  .sketch-bg {
    background-color: #faf9f6;
    background-image: radial-gradient(#d1d5db 1px, transparent 1px);
    background-size: 20px 20px;
  }
  .sketch-card {
    background-color: white;
    border: 2px solid #e5e7eb;
    border-radius: 8px 24px 8px 24px / 24px 8px 24px 8px;
    box-shadow: 4px 6px 0px -1px #e5e7eb;
  }
</style>
</head>
<body class="sketch-bg p-10 h-screen flex gap-4">
  <div class="sketch-card flex-1 p-8">
    <h1 class="text-2xl font-bold text-slate-800">Sketchpad Style</h1>
    <p class="mt-4 text-slate-600">This simulates an electronic sketchpad.</p>
  </div>
  <div class="sketch-card w-1/3 p-8 bg-amber-50/50">
    <h1 class="text-2xl font-bold text-amber-900">Concept Sheet</h1>
    <p class="mt-4 text-amber-800">Side by side display</p>
  </div>
</body>
</html>
